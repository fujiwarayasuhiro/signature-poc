<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>作業完了確認サイン</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>

* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 10px;
  background-color: #f4f7f9;
  overscroll-behavior: none;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: #fff;
  padding: 12px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

h2 {
  margin: 0 0 8px 0;
  font-size: 16px;
  text-align: center;
  color: #0056b3;
  flex-shrink: 0;
}

#work-info {
  background: #f8f9fa;
  padding: 8px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 12px;
  flex-shrink: 0;
}

#work-info p {
  margin: 2px 0;
  display: flex;
  justify-content: space-between;
}

#work-info span {
  font-weight: bold;
  color: #333;
}

.canvas-container {
  position: relative;
  width: 95%;
  margin: 0 auto;
  flex-grow: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 縦持ち（ポートレート）レイアウト要件: 高さ=利用可能高さ60% */
@media (orientation: portrait) {
  .canvas-container {
    height: 60vh;
  }
}

/* 横持ち（ランドスケープ）レイアウト要件: 高さ=利用可能高さ75% */
@media (orientation: landscape) {
  .card {
    padding: 6px;
  }
  h2 {
    margin: 0 0 4px 0;
    font-size: 14px;
  }
  #work-info {
    display: flex;
    justify-content: space-around;
    padding: 4px;
    margin-bottom: 4px;
  }
  #work-info p {
    margin: 0 4px;
  }
  .canvas-container {
    height: 75vh;
  }
}

canvas {
  border: 2px solid #ced4da;
  border-radius: 8px;
  width: 100%;
  height: 100%;
  touch-action: none;
  background-color: #fff;
}

.btn-group {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-shrink: 0;
}

button {
  flex: 1;
  font-size: 15px;
  font-weight: bold;
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 0.2s;
}

button:active {
  opacity: 0.7;
}

.btn-back {
  background: #17a2b8;
  color: #fff;
}

.btn-clear {
  background: #6c757d;
  color: #fff;
}

.btn-save {
  background: #28a745;
  color: #fff;
}

.note {
  font-size: 11px;
  color: #777;
  margin-top: 4px;
  margin-bottom: 0;
  text-align: center;
  flex-shrink: 0;
}

/* モーダル */

.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.modal-content {
  background: #fff;
  width: 100%;
  max-width: 600px;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  max-height: 95vh;
  overflow-y: auto;
}

.modal-content h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 16px;
}

#previewImage {
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-bottom: 10px;
  background: #fff;
}

.modal-btn-group {
  display: flex;
  gap: 10px;
}

.modal-btn-group button {
  flex: 1;
}

</style>
</head>

<body>

<div class="card">

  <h2>作業完了のご確認</h2>

  <div id="work-info">

    <p>
      点検No：
      <span id="displayWorkId">読み込み中...</span>
    </p>

    <p>
      点検名：
      <span id="displaySummary">読み込み中...</span>
    </p>

    <p>
      事業所名(施設名)：
      <span id="displaySiteName">読み込み中...</span>
    </p>

    <p>
      作業日：
      <span id="displayDate">読み込み中...</span>
    </p>

  </div>

  <div class="canvas-container">
    <canvas id="signature"></canvas>
  </div>

  <div class="btn-group">

    <button
      type="button"
      class="btn-back"
      onclick="goBack()">
      戻る
    </button>

    <button
      type="button"
      class="btn-clear"
      onclick="clearPad()">
      クリア
    </button>

    <button
      type="button"
      class="btn-save"
      onclick="saveSignature()">
      保存
    </button>

  </div>

  <p class="note">
    ※ 枠内にサイン後、「保存」を押してください
  </p>

</div>

<div id="previewModal" class="modal">

  <div class="modal-content">

    <h3>この内容で保存しますか？</h3>

    <img
      id="previewImage"
      alt="署名プレビュー"
    >

    <div class="modal-btn-group">

      <button
        type="button"
        class="btn-clear"
        onclick="closeModal()">
        キャンセル
      </button>

      <button
        type="button"
        class="btn-save"
        onclick="confirmSave()">
        保存
      </button>

    </div>

  </div>

</div>

<script src="signature_pad.min.js"></script>

<script src="signature.js"></script>

</body>
</html>
